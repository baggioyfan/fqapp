name: macOS build (Intel x86_64, Ventura-compatible)

# 产出可在 macOS 13 Ventura（Intel）上运行的 .app。上游没有 macos/ 平台目录，
# 构建前由 scripts/build_macos.sh 用 `flutter create --platforms=macos` 生成。
#
# runner 选择：macos-15-intel 是 GitHub 目前唯一的 x86_64 macOS runner
# （macOS 15 Sequoia / Intel，4 vCPU / 14 GB），2027-08 退役；macos-13（Ventura）
# 已于 2025-12 停用。原生 x86_64 构建比在 Apple Silicon runner 上交叉编译稳，
# 后者 Flutter 3.44 会告警、且 CocoaPods 依赖容易缺 x86_64 slice。

on:
  workflow_dispatch:
    inputs:
      run_codegen:
        description: 先重跑 flutter_rust_bridge codegen（仅 Rust API 层变更后需要）
        type: boolean
        default: false
  # 发布时由 android-apk.yml 复用：同一次 dispatch 里先出 APK 和 .app，
  # 再合成一个 Release（见那边的 publish job）。单独触发时行为不变。
  workflow_call:
    inputs:
      run_codegen:
        description: 先重跑 flutter_rust_bridge codegen
        type: boolean
        default: false
  pull_request:
    paths:
      - 'lib/**'
      - 'rust/**'
      - 'native/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'scripts/build_macos.sh'
      - 'scripts/generate_app_icons.py'
      - '.github/workflows/macos.yml'
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'rust/**'
      - 'native/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'scripts/build_macos.sh'
      - 'scripts/generate_app_icons.py'
      - '.github/workflows/macos.yml'

permissions:
  contents: read

concurrency:
  # 被复用时 github.workflow 是调用方的名字（Android APK），因此发布会和
  # master push 触发的独立 macOS 构建分属不同 group，不会互相取消。
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: x86_64-apple-darwin

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          flutter --version
          cargo --version

      - name: Free disk space
        run: |
          df -h /
          # macOS 构建用不到 iOS 模拟器运行时；标准 runner 盘只有 ~14 GB 空闲，
          # Flutter + Rust（LTO）的中间产物很容易把它撑爆。
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf ~/Library/Developer/Xcode/DerivedData || true
          df -h /

      - name: Pin connectivity_plus to 7.0.0 for the macOS SDK
        # 本 runner 只有 Xcode 16.4（macOS 15.5 SDK），connectivity_plus 7.1.0+ 的
        # NWPath.isUltraConstrained 编译不过。用 pub 的局部覆盖降到 7.0.0，
        # pubspec.yaml / pubspec.lock 保持 Android 的 7.3.x（覆盖文件在 .gitignore 里）。
        run: |
          printf 'dependency_overrides:\n  connectivity_plus: 7.0.0\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml

      - name: Analyze and run desktop tests
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub \
            test/desktop_platform_test.dart \
            test/desktop_detail_layout_test.dart \
            test/desktop_video_layout_test.dart

      - name: Build macOS app
        env:
          FQAPP_MACOS_CODEGEN: ${{ inputs.run_codegen && '1' || '0' }}
        run: |
          mkdir -p build
          set -o pipefail
          bash scripts/build_macos.sh 2>&1 | tee build/macos-build.log

      - uses: actions/upload-artifact@v4
        with:
          name: fqapp-macos-x64
          path: |
            fqapp-macos-x64.zip
            build/macos-build.log
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-build-logs
          path: |
            build/macos-build.log
            build/macos/**/*.log
          if-no-files-found: ignore
          retention-days: 7
