name: macOS build (universal arm64 + x86_64)

# 产出一个可在 macOS 13 Ventura 及以上运行的 .app：**只有 universal 一个包**，
# 同一个 fqapp.app 里同时带 arm64（Apple Silicon 原生）与 x86_64（Intel 原生）
# 两份 slice，用户不用挑包。
#
# 为什么不是两个包：两个 slice 只在磁盘/下载上各占一份，运行时 dyld 只映射当前
# 架构那一份（实测 universal 与 lipo -thin 的物理内存、启动耗时一致），所以
# 「合一」没有运行开销；而分两个包时，「选错包 → 打不开 / Rosetta 提示」是每次
# 都要人工解释一遍的支持成本。2026-11-02 起构建流里的 arm64 / x86_64 单包分支
# 已整体删除 —— 只有 universal 一条路径，没有可选项。
# 本地排障若只要单个架构，仍可用 FQAPP_MACOS_ARCH=arm64|x86_64 直接调
# scripts/build_macos.sh，那是脚本能力，不进 CI。
#
# 最低系统由 scripts/build_macos.sh 的 DEPLOY_MIN 决定（当前 13.0）。
# 上游没有 macos/ 平台目录，构建前由 scripts/build_macos.sh 用
# `flutter create --platforms=macos` 生成。
#
# runner 选择：universal 只能在 Apple Silicon 上构建（macos-15，M1，3 vCPU /
# 7 GB，GA）—— Xcode 的 ARCHS_STANDARD 在 macOS 上就是双架构，单跑一次即得
# 两条 slice，比另起一台 Intel runner 各编一遍省一整个 job 的墙钟。macos-26
# 已可用但仍是新镜像，且 Xcode 26 的 macOS 26 SDK 会让 connectivity_plus 的
# 7.0.0 覆盖失去必要性 —— 稳定优先，先钉 macos-15。
# macos-14 已于 2026-11-02 退役，不要再用。

on:
  workflow_dispatch:
    inputs:
      run_codegen:
        description: 先重跑 flutter_rust_bridge codegen（仅 Rust API 层变更后需要）
        type: boolean
        default: false
  # 发布/交付时由 android-apk.yml 复用：同一次 dispatch 里先出 APK 和这个
  # universal 包，带 release_tag 时再合成一个 Release（见那边的 publish job）。
  # 单独触发时行为不变。
  workflow_call:
    inputs:
      run_codegen:
        description: 先重跑 flutter_rust_bridge codegen
        type: boolean
        default: false
  pull_request:
    paths:
      - 'lib/**'
      - 'rust/**'
      - 'native/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'scripts/build_macos.sh'
      - 'scripts/generate_app_icons.py'
      - '.github/workflows/macos.yml'
  # 去掉 push 自动触发。日常推代码只想跑 Dart Check，macOS 全量构建留给发布
  # ——发布时由 android-apk.yml 通过 workflow_call 复用本文件，不受影响。

permissions:
  contents: read

concurrency:
  # 被 android-apk.yml 复用时 github.workflow 是调用方的名字（Android APK）；
  # 单独 dispatch 时是本文件的名字。两者 group 不同，不会互相取消。
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只有一条 leg，不需要「先算 matrix 再 spread」的 plan job：runs-on / targets /
# artifact 名都写死，job 少一个、排队少一轮。历史上「arm64 leg 跑 PR、x64 交给
# 发布」的省机器做法，正好让「Rust dylib 只有 arm64 一条 slice」这种问题一路
# 留到用户机器上 —— 单 leg 反而更安全。
jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          flutter --version
          cargo --version

      - name: Free disk space
        run: |
          df -h /
          # macOS 构建用不到 iOS 模拟器运行时；标准 runner 盘只有 ~14 GB 空闲，
          # Flutter + Rust（LTO）的中间产物很容易把它撑爆。
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf ~/Library/Developer/Xcode/DerivedData || true
          df -h /

      - name: Pin connectivity_plus to 7.0.0 for the macOS SDK
        # 本 runner 只有 Xcode 16.4（macOS 15.5 SDK），connectivity_plus 7.1.0+ 的
        # NWPath.isUltraConstrained 编译不过。用 pub 的局部覆盖降到 7.0.0，
        # pubspec.yaml / pubspec.lock 保持 Android 的 7.3.x（覆盖文件在 .gitignore 里）。
        # build_macos.sh 也会写同一份覆盖（它负责在退出时还原 lock），内容一致，
        # 这里提前写是为了让下面的 analyze / test 也在同一套依赖下跑。
        run: |
          printf 'dependency_overrides:\n  connectivity_plus: 7.0.0\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml

      - name: Analyze and run desktop tests
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub \
            test/desktop_platform_test.dart \
            test/desktop_detail_layout_test.dart \
            test/desktop_video_layout_test.dart

      - name: Build macOS app (universal)
        env:
          # 目标架构由脚本据此选 Rust triple 集合与 Xcode ARCHS；必须显式传，
          # 不能靠宿主推断。universal 时脚本编两条 triple 再 lipo 合成 dylib。
          FQAPP_MACOS_ARCH: universal
          FQAPP_MACOS_CODEGEN: ${{ inputs.run_codegen && '1' || '0' }}
        run: |
          mkdir -p build
          set -o pipefail
          bash scripts/build_macos.sh 2>&1 | tee build/macos-build.log

      - uses: actions/upload-artifact@v4
        with:
          name: fqapp-macos-universal
          path: |
            fqapp-macos*.zip
            build/macos-build-*.log
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-build-logs
          path: |
            build/macos-build-*.log
            build/macos/**/*.log
          if-no-files-found: ignore
          retention-days: 7
