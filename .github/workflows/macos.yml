name: macOS build (Apple Silicon arm64 / Intel x86_64)

# 产出可在 macOS 13 Ventura 及以上运行的 .app，两个架构各一个包：
#   arm64  → Apple Silicon 原生（macos-15 是 GitHub 的标准 arm64 runner）
#   x86_64 → Intel 原生；Apple Silicon 上也能经 Rosetta 跑
# 最低系统由 scripts/build_macos.sh 的 DEPLOY_MIN 决定（当前 13.0）。
# 上游没有 macos/ 平台目录，构建前由 scripts/build_macos.sh 用
# `flutter create --platforms=macos` 生成。
#
# runner 选择：
#   arm64  → macos-15（M1，3 vCPU / 7 GB，GA）。macos-26 已可用但仍是新镜像，
#            且 Xcode 26 的 macOS 26 SDK 会让 connectivity_plus 的 7.0.0 覆盖
#            失去必要性 —— 稳定优先，先钉 macos-15。
#   x86_64 → macos-15-intel（GitHub 唯一的 x86_64 macOS runner，2027-08 退役）。
#            原生 x86_64 构建比在 Apple Silicon 上交叉编译稳。
# macos-14 已于 2026-11-02 退役，不要再用。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 目标架构
        type: choice
        options:
          - both
          - arm64
          - x86_64
        default: both
      run_codegen:
        description: 先重跑 flutter_rust_bridge codegen（仅 Rust API 层变更后需要）
        type: boolean
        default: false
  # 发布/交付时由 android-apk.yml 复用：同一次 dispatch 里先出 APK 和两个 .app，
  # 带 release_tag 时再合成一个 Release（见那边的 publish job）。单独触发时行为不变。
  workflow_call:
    inputs:
      arch:
        description: 目标架构（both / arm64 / x86_64）
        type: string
        default: both
      run_codegen:
        description: 先重跑 flutter_rust_bridge codegen
        type: boolean
        default: false
  pull_request:
    paths:
      - 'lib/**'
      - 'rust/**'
      - 'native/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'scripts/build_macos.sh'
      - 'scripts/generate_app_icons.py'
      - '.github/workflows/macos.yml'
  # 去掉 push 自动触发。日常推代码只想跑 Dart Check，macOS 全量构建留给发布
  # ——发布时由 android-apk.yml 通过 workflow_call 复用本文件，不受影响。

permissions:
  contents: read

concurrency:
  # 被 android-apk.yml 复用时 github.workflow 是调用方的名字（Android APK）；
  # 单独 dispatch 时是本文件的名字。两者 group 不同，不会互相取消。
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 目标架构要在 job 开始前定下来，而 matrix 是静态的，所以先用一个极轻的 job
  # 把「这次该编哪些架构」算成 JSON。比在 matrix job 里用 if 跳过更可靠
  # ——job 级 if 拿不到 matrix 上下文。
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Resolve the architecture matrix
        id: set
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.arch }}
        run: |
          want="${REQUESTED:-both}"
          # PR 只验 arm64：这是新增路径，也是绝大多数用户会装的包；x64 由发布
          # 流程覆盖。否则每次 PR 都要烧两倍 macOS runner 分钟。
          if [ "$EVENT" = "pull_request" ]; then
            want="arm64"
          fi
          arm64_leg='{"arch":"arm64","runner":"macos-15","triple":"aarch64-apple-darwin","artifact":"fqapp-macos-arm64"}'
          x64_leg='{"arch":"x86_64","runner":"macos-15-intel","triple":"x86_64-apple-darwin","artifact":"fqapp-macos-x64"}'
          case "$want" in
            both)   legs="[$arm64_leg,$x64_leg]" ;;
            arm64)  legs="[$arm64_leg]" ;;
            x86_64) legs="[$x64_leg]" ;;
            *)
              echo "::error::arch 只能是 both / arm64 / x86_64（收到 '$want'）" >&2
              exit 1
              ;;
          esac
          printf 'matrix={"include":%s}\n' "$legs" >> "$GITHUB_OUTPUT"
          printf '本次构建：%s\n' "$want" >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.triple }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          flutter --version
          cargo --version

      - name: Free disk space
        run: |
          df -h /
          # macOS 构建用不到 iOS 模拟器运行时；标准 runner 盘只有 ~14 GB 空闲，
          # Flutter + Rust（LTO）的中间产物很容易把它撑爆。
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          rm -rf ~/Library/Developer/Xcode/DerivedData || true
          df -h /

      - name: Pin connectivity_plus to 7.0.0 for the macOS SDK
        # 本 runner 只有 Xcode 16.4（macOS 15.5 SDK），connectivity_plus 7.1.0+ 的
        # NWPath.isUltraConstrained 编译不过。用 pub 的局部覆盖降到 7.0.0，
        # pubspec.yaml / pubspec.lock 保持 Android 的 7.3.x（覆盖文件在 .gitignore 里）。
        # build_macos.sh 也会写同一份覆盖（它负责在退出时还原 lock），内容一致，
        # 这里提前写是为了让下面的 analyze / test 也在同一套依赖下跑。
        run: |
          printf 'dependency_overrides:\n  connectivity_plus: 7.0.0\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml

      - name: Analyze and run desktop tests
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub \
            test/desktop_platform_test.dart \
            test/desktop_detail_layout_test.dart \
            test/desktop_video_layout_test.dart

      - name: Build macOS app (${{ matrix.arch }})
        env:
          # 目标架构由脚本据此选 Rust triple 与 Xcode ARCHS；这里必须显式传，
          # 不能靠宿主推断 —— x86_64 leg 虽然宿主也是 x86_64，但显式更不容易错。
          FQAPP_MACOS_ARCH: ${{ matrix.arch }}
          FQAPP_MACOS_CODEGEN: ${{ inputs.run_codegen && '1' || '0' }}
        run: |
          mkdir -p build
          set -o pipefail
          bash scripts/build_macos.sh 2>&1 | tee "build/macos-build-${FQAPP_MACOS_ARCH}.log"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            fqapp-macos-*.zip
            build/macos-build-*.log
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-build-logs-${{ matrix.arch }}
          path: |
            build/macos-build-*.log
            build/macos/**/*.log
          if-no-files-found: ignore
          retention-days: 7
