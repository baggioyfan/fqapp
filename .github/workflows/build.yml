name: Build & Package

# 构建与打包的唯一入口：日常 push/PR 只出 APK（外加并行的 Dart 门禁），
# dispatch 时按勾选项追加 macOS / Windows / Linux 包，填了 release_tag 才发
# Release。文件名 `build.yml`、流程名 `Build & Package` —— 它早就不只是
# 「Android APK」了（2026-11-13 由 android-apk.yml 改名，被 release.yml 的
# workflow_run 与 test/build_rust_backend_scripts_test.cjs 按名/按路径引用，
# 再改名要同步那两处）。

on:
  # 推 master 不再自动构建：本 fork 的发布一律走 workflow_dispatch（带
  # release_tag 才发 Release），日常推代码只想起一次快速的 Dart Check。
  # 之前 `branches: [master]` 让每次改 lib/ 都白跑 15 分钟 APK + macOS，
  # 还会和 dispatch 的发布 run 抢同一个 concurrency 组（cancel-in-progress
  # 会让发布 run 被顶掉）。恢复自动构建就把 branches 那行贴回来。
  #
  # 交付基线是 APK + macOS universal 包：一次 dispatch 就全出（`macos` 默认
  # 勾选），Release 至少挂这两个资产 + build-info。Windows 便携包是可选的
  # **可发布**资产：默认不勾（一台 runner 约 45 分钟），勾了且构建成功就随
  # release_tag 一并挂进 Release，没勾则完全不参与发版判定。Linux 仍只进
  # Artifacts，不进 Release 资产（LINUX.md 红线 4）。
  push:
    # 打 tag 仍出包：tag 推送不走 paths 过滤（native-crypto 在 v1.0.117
    # tag 推送时已跑过一次可作证），所以推 v* 会触发一次完整构建，APK 在
    # Artifacts 里，不用建 Release 也能拿到安装包。
    tags: ['v*']
    # 这个列表曾经在 push 和 pull_request 下各抄一份，加一条路径要改两处，
    # 漏一处就会变成「PR 跑、master 不跑」。现在只有一个定义，PR 直接引用。
    paths: &app_paths
      - 'lib/**'
      - 'android/**'
      - 'linux/**'
      - 'packaging/**'
      - 'native/**'
      - 'rust/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'test/**'
      - 'flutter_rust_bridge.yaml'
      - 'scripts/build_rust_backend.sh'
      - 'scripts/build_linux_package.sh'
      - 'scripts/build_rust_backend.ps1'
      - 'scripts/run_rust_host_tests.sh'
      - 'scripts/run_rust_host_tests.ps1'
      - 'scripts/check_native_alignment.cjs'
      - 'scripts/check_line_budget.sh'
      - 'scripts/generate_app_icons.py'
      - 'scripts/verify_android_apk.py'
      - 'scripts/verify_audio_cenc.cjs'
      - '.github/workflows/build.yml'
      - '.cargo/config.toml'
  pull_request:
    # Fork PRs receive no signing secrets, so the signing step degrades to an
    # unsigned build instead of failing; the same paths filter keeps
    # unrelated PRs from running the full build.
    paths: *app_paths
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Tag to publish as a GitHub Release, for example v1.0.122-fq1. Leave
          empty to only build and upload the packages as workflow artifacts.
        required: false
        type: string
      macos:
        # 交付面固定为两个文件：APK + macOS universal 包。留一个开关是为了
        # 「只想快速拿个 APK」时不必额外烧一台 macOS runner（约 20 分钟）。
        # 填了 release_tag 时本开关无效 —— 发布必须两件齐全。
        description: 同时构建 macOS 包（universal：一个包内含 arm64 + x64）
        required: false
        type: boolean
        default: true
      linux:
        # 实验性：Arch 容器里编得出包，但没有 Linux 桌面做安装/朗读/播放实测。
        # 默认关闭；产物只进 Artifacts，不进 Release（见 LINUX.md 红线 4）。
        description: 同时构建 Linux Arch 包（实验性，未做真机验证，不随 Release 发布）
        required: false
        type: boolean
        default: false
      windows:
        # 一台 windows-latest 大约 45 分钟，所以默认关。勾上并成功构建时，
        # 便携包会随 release_tag 一起挂进正式 Release（publish 用
        # `success || skipped` 判定，没勾不会挡住发版）；不发版时它照旧留在
        # Artifacts 里供人下载。
        description: 同时构建 Windows 便携包（勾选后，若填了 release_tag 则随 Release 一并发布）
        required: false
        type: boolean
        default: false

permissions:
  # gh release create needs write access; every other step only reads.
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # iOS 端需要 Flutter >= 3.47（Xcode 27 适配补丁），pubspec.lock 也已按 3.47 解析，
  # Android 构建必须用同一版本，否则 --enforce-lockfile 会失败。
  FLUTTER_VERSION: '3.47.9'
  # Pinned flutter_rust_bridge toolchain. The Rust crate, the generated bindings
  # and the codegen binary must all be the same version.
  FRB_VERSION: '2.13.0'
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'
  BUILD_TOOLS_VERSION: '36.0.0'
  # Certificate the release APK must carry. The built APK is compared against
  # this, so a package signed with the wrong key -- or not signed at all --
  # fails here instead of being published. The matching keystore is stored
  # as a repository secret.
  #
  # A fork can never reproduce the upstream certificate, so the default only
  # applies until you sign with your own keystore. Set a repository variable of
  # the same name (Settings -> Secrets and variables -> Actions -> Variables) to
  # your own certificate's SHA-256, otherwise adding the keystore secrets makes
  # the signing step fail the pin check rather than switch to your key.
  RELEASE_SIGNER_SHA256: ${{ vars.RELEASE_SIGNER_SHA256 || 'e8471cd8a935fd71fd8197355b5558d245449d5bc8294f60f88616f60451c550' }}
  FQAPP_USE_MAVEN_MIRRORS: 'false'
  # workers.max / CMAKE_BUILD_PARALLEL_LEVEL 保持 2，不要再“优化”成 4。
  # 上游实测过：提到 4 在这个 4 vCPU / 16 GB 的 runner 上反而更慢 ——
  # release APK 编译 220s -> 342s，:app:testDebugUnitTest 66s -> 91s。
  # R8、资源压缩、CMake 这几段任务不够短，超额订阅只换来内存压力和上下文
  # 切换。原话见 ch6vip/fqapp 的 3b81457。
  #
  # kotlin.incremental 保持关闭（android/gradle.properties 里已经是 false）。
  # 上游在 CI 里强制打开，理由是 gradle.properties 关它只是为了躲 Windows 的
  # 文件锁 bug。但 CI 每次都是干净 checkout，build/ 是空的，"增量"编译只能
  # 退化成全量编译，却还要额外维护增量状态 —— 除非 setup-gradle 的 build
  # cache 能把 build/ 恢复回来，否则这条没有收益。实测数据见下面的注释。
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m" -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Check out app source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          persist-credentials: false

      # 版本单调性闸门要读 `git tag --list 'v*'`，但默认 checkout 是
      # `--depth=1 --no-tags`，那份列表是空的 —— 闸门在所有分支/PR 构建上
      # 都是静默通过，等于不存在。`fetch-tags: true` 也救不了：checkout 仍然
      # 带 --depth=1，浅取只解析得到从 tip 可达的 tag。必须显式 fetch 一次。
      - name: Fetch version tags for the monotonicity gate
        run: |
          git fetch --tags --force origin '+refs/tags/v*:refs/tags/v*' \
            || git fetch --tags --force origin
          count="$(git tag --list 'v*' | wc -l)"
          if [ "$count" -eq 0 ]; then
            # 不致命：下游闸门退化成「没有可比对的 tag」。但要大声说出来，
            # 「一声不响地通过」正是这个闸门以前失效的方式。
            echo '::warning::No v* tags are visible; the version-monotonicity gate cannot run.'
          else
            printf 'Visible v* tags: %s (highest: %s)\n' \
              "$count" "$(git tag --list 'v*' --sort=-v:refname | head -1)"
          fi

      - name: Compute artifact identifiers
        id: artifact-ids
        run: |
          # Placed right after checkout so the failure-diagnostics upload can
          # use the same identifiers even when the build fails early.
          # Artifact names reject '/', which a PR ref (123/merge) contains,
          # so sanitize the ref. run_number stays so re-runs never collide.
          printf 'safe_ref=%s\n' "${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Validate version tag
        if: github.ref_type == 'tag'
        run: |
          # A version tag is a semver triple with an optional fork suffix
          # (v1.2.3 or v1.2.3-fq1): the APK's versionName is compared against
          # the tag below, and anything else (v1.2, a typo) would silently
          # ship a mismatched build. The -fqN suffix is the fork's release
          # counter on top of an upstream baseline; it is release metadata
          # only and never part of the versionName, so every comparison
          # against the APK strips it.
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-fq[0-9]+)?$ ]]; then
            echo "::error::Version tag must match v<major>.<minor>.<patch>[-fqN] (got '$GITHUB_REF_NAME')" >&2
            exit 1
          fi
          version_name="${GITHUB_REF_NAME#v}"
          version_name="${version_name%%-fq*}"
          printf 'Building version tag %s (expected versionName %s)\n' \
            "$GITHUB_REF_NAME" "$version_name"

      # The product build has no private backend checkout and no extra
      # toolchain. The golden vectors in rust/testdata/ are checked in and
      # are never an input to this workflow.

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned to the exact stable release (1.99.1 as of 2026-10-16),
          # not the floating `stable` channel: a new stable must not silently
          # change the toolchain a release was built with. Bump deliberately.
          toolchain: '1.99.1'
          # ARM64 only. The 32-bit (armv7) target was dropped on purpose: it
          # doubled the Rust cross-compile and the APK build for devices that
          # are not in use. Re-adding it means the toolchain target, the
          # compile/verify steps, the build script and the release assets.
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/rust

      - name: Cache flutter_rust_bridge_codegen
        id: frb-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          # The lockfile pins the codegen binary's exact transitive
          # dependency tree: without its hash a stale cached binary would
          # survive a lockfile change that should have rebuilt it.
          # (Checkout path is app/, so the hash path is repo-root-relative.)
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb-cache.outputs.cache-hit != 'true'
        # Swatinem/rust-cache also restores ~/.cargo/bin, so a codegen-cache key
        # miss (any change to rust/Cargo.lock) can still find an older binary
        # there; --force keeps the install working either way.
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked --force

      # setup-java 故意不设 cache: gradle —— 下面的 setup-gradle 接管 Gradle
      # User Home 缓存，两者同时启用会互相覆盖（setup-gradle 文档明确要求
      # 避免同时开）。setup-java 现在只负责装 JDK。
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # 换掉 cache: gradle 的原因：它只缓存 ~/.gradle/caches/modules-2，也就是
      # 下载下来的依赖 jar。而这一步真正费时的是 R8、资源压缩和
      # shortplay_crypto 的 CMake 交叉编译，产物都在 build/ 里，只有 local
      # build cache 能复用。setup-gradle 还一并恢复 Gradle 发行版和编译过的
      # build script。
      #
      # 未指定 build-root-directory（与上游一致）：源码 checkout 在 app/，
      # 这一步只在仓库根配置缓存。跑一次后到日志里确认 "Gradle User Home"
      # 的命中情况；如果一直 miss，再补 build-root-directory: app/android。
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 钉住的 NDK 与 CMake 都不在 ubuntu-24.04 镜像里（镜像带的是 27.3/29/30
      # 与 3.31/4.1），每次全量下载要几分钟。两者各用各的 key：NDK 升版不该
      # 把 CMake 条目一起失效。
      # 路径写死成 runner 镜像文档里的 SDK 根，不用 ${{ env.ANDROID_HOME }} ——
      # 那是 RUN 时才注入的变量，在 ${{ }} 里展开是空串，缓存路径会变成
      # /ndk/... 与 /cmake/...，actions/cache 直接拒绝保存（Path(s) ... do(es)
      # not exist），缓存看似配了其实一次都没生效。
      - name: Cache the pinned NDK
        id: ndk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-${{ runner.os }}

      - name: Cache the pinned CMake
        id: cmake-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/cmake/${{ env.CMAKE_VERSION }}
          key: android-cmake-${{ env.CMAKE_VERSION }}-${{ runner.os }}

      - name: Install Android SDK components
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager_bin" --licenses < <(yes) > /dev/null
          # 缓存命中时目录已经在盘上，再让 sdkmanager 查一遍只是白跑网络往返。
          missing=()
          for pkg in "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"; do
            if [ ! -d "$ANDROID_HOME/${pkg%%;*}/${pkg##*;}" ]; then
              missing+=("$pkg")
            fi
          done
          "$sdkmanager_bin" "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" \
            ${missing[@]+"${missing[@]}"}
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$NDK_VERSION" >> "$GITHUB_ENV"
          flutter config --android-sdk "$ANDROID_HOME" --no-analytics

      - name: Check the Web assets, audio diagnostics, Rust build scripts, and .so freshness
        run: >-
          node --test test/web_assets_test.cjs
          test/verify_audio_cenc_test.cjs
          test/build_rust_backend_scripts_test.cjs
          test/check_native_alignment_test.cjs
          test/check_so_freshness_test.cjs

      # rustfmt follows `mod` declarations, so a plain `cargo fmt --all` also
      # checks rust/src/frb_generated.rs -- codegen output that no human edits.
      # That file does not round-trip through rustfmt, so `--all` fails on a
      # clean tree and blocks every build, including a contributor's first one.
      # `--config skip_children` on the crate root is NOT a fix: it stops at the
      # root file and silently passes even when a hand-written module is
      # misformatted. So instead we enumerate the tracked hand-written sources
      # and check each on its own, which keeps the gate real while leaving the
      # generated bindings to the reproducibility check further down.
      - name: Resolve Dart package dependencies
        run: flutter pub get --enforce-lockfile

      - name: Rust formatting
        run: |
          mapfile -t sources < <(
            git ls-files -- 'rust/**/*.rs' 'rust/*.rs' | grep -v 'frb_generated\.rs$'
          )
          if [ "${#sources[@]}" -eq 0 ]; then
            echo 'No hand-written Rust sources found; refusing to pass an empty gate.' >&2
            exit 1
          fi
          printf 'Checking %d hand-written Rust sources (generated bindings excluded).\n' \
            "${#sources[@]}"
          failed=0
          for source in "${sources[@]}"; do
            # One file per invocation, with child traversal off: a bare
            # `rustfmt lib.rs` follows `mod frb_generated;` and would re-check the
            # bindings, while `skip_children` on the crate root would skip every
            # other module too. Per-file, each hand-written source is checked
            # exactly once and each child is covered by its own loop iteration.
            if ! rustfmt --check --edition 2021 --config skip_children=true "$source"; then
              printf 'Misformatted: %s\n' "$source" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Rust lints
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust tests (signing, device crypto, protocol vectors)
        run: cargo test --manifest-path rust/Cargo.toml --locked

      # The host build is what the real Dart -> FRB -> Rust integration tests
      # load; without it those tests are reported as skipped, never as passed.
      - name: Build the host Rust core for the FFI integration tests
        run: cargo build --manifest-path rust/Cargo.toml

      - name: Host FFI integration tests (Dart -> FRB -> Rust, mock upstream)
        run: bash scripts/run_rust_host_tests.sh --skip-build

      - name: Generate the bridge bindings and verify they are reproducible
        run: |
          # Content-hash the generated tree instead of using `git diff`: rust/ and
          # lib/src/ can be untracked in a fresh checkout, where git diff compares
          # nothing at all and the check would silently pass.
          mkdir -p build/ci-artifacts
          digest() {
            find rust/src/frb_generated.rs lib/src/rust -type f -print0 \
              | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1
          }
          before="$(digest)"
          flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml
          after="$(digest)"
          printf 'generated bindings digest (before): %s\n' "$before"
          printf 'generated bindings digest (after):  %s\n' "$after"
          if [ "$before" != "$after" ]; then
            echo 'Generated bindings are stale: commit the output of flutter_rust_bridge_codegen.' >&2
            exit 1
          fi
          {
            printf 'bindings_sha256=%s\n' "$after"
          } > build/ci-artifacts/bindings-digest.txt

      - name: Compile the Rust core for Android (ARM64)
        run: bash scripts/build_rust_backend.sh --skip-codegen

      - name: Check the Android Rust core library
        run: |
          mkdir -p build/ci-artifacts
          abi=arm64-v8a
          so=android/app/src/main/jniLibs/$abi/libfqapi_core.so
          test -s "$so"
          nm_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$nm_bin" --dynamic --defined-only "$so" > "build/ci-artifacts/rust-core-symbols-$abi.txt"
          # flutter_rust_bridge entry points must be exported for dart:ffi.
          for symbol in frb_get_rust_content_hash store_dart_post_cobject; do
            if ! grep -Eq "[[:space:]]${symbol}$" "build/ci-artifacts/rust-core-symbols-$abi.txt"; then
              echo "Missing Rust bridge symbol in $abi: $symbol" >&2
              exit 1
            fi
          done
          # 16 KiB page alignment is required by Android 15+. The check runs
          # through scripts/check_native_alignment.cjs -- the same script the
          # APK verifier uses on the packaged libraries -- so there is one
          # definition of "aligned": every LOAD segment p_align >= 16 KiB,
          # power-of-two, with offset/address congruent mod 16 KiB. The old
          # inline `readelf | grep LOAD.*0x4000$` only eyeballed one field
          # and could pass a library misaligned in the other dimensions.
          # The readelf dump stays as a diagnostics artifact.
          readelf_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf_bin" -l "$so" > "build/ci-artifacts/rust-core-program-headers-$abi.txt"
          node scripts/check_native_alignment.cjs "$so"

      # A contributor or fork has no access to the release keystore secrets, and
      # a hard failure here would make the workflow README recommends unusable
      # for exactly the audience most likely to run it. So the gate degrades:
      # with the secrets present the release identity is restored and pinned;
      # without them Gradle falls back to the Android debug identity, so the
      # package stays installable instead of being born unsigned. That fallback
      # is generated by the build machine, so there is no certificate worth
      # pinning -- the verification step still demands a signature, which is
      # what keeps an unsigned package out of a release.
      - name: Restore the release signing identity
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::warning::No release signing secrets (%s); the release APKs will carry the Android debug identity instead. They cannot be installed over a build signed with the release key.\n' \
              "$(IFS=,; printf '%s' "${missing[*]}")"
            printf 'has_release_signing=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          signing_path="$RUNNER_TEMP/fqapp-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_path"
          actual_signer="$(keytool -exportcert -keystore "$signing_path" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)"
          if [[ "$actual_signer" != "$RELEASE_SIGNER_SHA256" ]]; then
            # Wrong-key is a real defect, not a missing capability: fail loudly
            # rather than shipping a package the maintainer cannot upgrade.
            echo 'The signing secret does not contain the expected release certificate.' >&2
            echo "::error::Expected $RELEASE_SIGNER_SHA256 but the secret holds $actual_signer" >&2
            exit 1
          fi
          {
            printf 'RELEASE_KEYSTORE_FILE=%s\n' "$signing_path"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          # Both branches must publish this. Leaving the success path unset makes
          # the reporting step read an empty value and describe a signed package
          # as an unsigned one, which is worse than either answer being wrong.
          printf 'has_release_signing=true\n' >> "$GITHUB_OUTPUT"
          printf 'Verified release signing certificate: %s\n' "$actual_signer"

      # Without the release keystore Gradle signs with a debug identity, which the
      # build machine would otherwise generate afresh on every run: each build
      # would then be a different signer, and because the manifest sets
      # allowBackup="false", upgrading would mean uninstalling and losing the
      # local shelf, progress and read time. So one identity is provisioned and
      # cached, and every later build signs with that same certificate.
      #
      # The path is explicit rather than the runner's default debug.keystore:
      # caching that default silently saved nothing, because it is not where AGP
      # looks. The credentials are the well-known debug ones, so this is not key
      # material worth protecting, and the cache is scoped to this repository.
      - name: Restore the fork signing identity
        if: steps.signing.outputs.has_release_signing != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fqapp-debug.p12
          key: fqapp-fork-debug-keystore-v1

      # Only the first run after a cache eviction regenerates the certificate;
      # installs signed by the previous identity then need one uninstall.
      - name: Provision the fork signing identity
        if: steps.signing.outputs.has_release_signing != 'true'
        run: |
          path="$RUNNER_TEMP/fqapp-debug.p12"
          if [ ! -f "$path" ]; then
            printf 'No cached fork identity; generating one.\n'
            keytool -genkeypair -keystore "$path" -storetype PKCS12 -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            printf 'FQAPP_DEBUG_KEYSTORE=%s\n' "$path"
          } >> "$GITHUB_ENV"
          # The debug signing config overrides only storeFile, so AGP's own
          # defaults -- alias androiddebugkey, password android -- must match
          # this file, and this line makes the identity in use visible.
          printf 'Fork signing certificate SHA-256: %s\n' \
            "$(keytool -exportcert -keystore "$path" -storepass android \
               -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"

      # analyze 与 flutter test 已搬到并行的 dart-gate job，这个 job 从此不再
      # 跑任何测试。由此带来一个简化：build 之前不需要再重 resolve 一次包。
      # 以前 flutter test 会注册仅 dev 用的 integration_test 插件，它的
      # Android 模块不能漏进 release 注册表，所以 build 必须重新解析一次；
      # 现在这个 job 里从未跑过 test，pub 状态本来就是干净的。
      #
      # 代价：apk job 内部不再有 analyze 门禁。测试与静态检查是否通过，由
      # publish job 的 needs 把关（见下方 publish.needs）。
      - name: Compile the release APK (ARM64)
        # --split-per-abi still produces the per-ABI name
        # (app-arm64-v8a-release.apk) instead of a fat APK. The 32-bit split was
        # dropped along with the armv7 Rust target: no device we ship to needs
        # it, and it doubled the cross-compile plus a full APK build.
        # Keep pub enabled (no --no-pub) so the release plugin registrant is
        # regenerated from the resolved dependency set. Nothing in this job
        # runs `flutter test` any more, so there is no dev-only
        # integration_test plugin to filter out.
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Test Android runtime boundaries
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Verify APK contents, signing, and 16 KiB alignment
        env:
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.has_release_signing }}
        run: |
          # Treat an unset value as a hard error rather than as "unsigned": an
          # empty value means the output was never published, and silently
          # reading that as "no signature" would quietly relax the gate on a
          # release build.
          case "$HAS_RELEASE_SIGNING" in
            true)  signer_args=(--expected-signer-sha256 "$RELEASE_SIGNER_SHA256") ;;
            # Without the secrets Gradle falls back to the debug identity, which
            # the build machine generates per run, so there is no certificate to
            # pin. Passing no signature arguments is not a relaxation: the script
            # only skips the signature check when --allow-unsigned is given, so
            # an unsigned package still fails this step outright.
            false) signer_args=() ;;
            *)
              echo "::error::The signing step did not report has_release_signing (got '$HAS_RELEASE_SIGNING')" >&2
              exit 1
              ;;
          esac
          # Tag builds must carry exactly the version the tag names; branch
          # and PR builds skip the assertion (no tag to compare against).
          # Version monotonicity. The two consistency gates (pubspec vs About,
          # and the tag assertion below) both pass on a *full revert* - f39daa5
          # followed by c3c858b moved both files back together - so the version
          # could silently go backwards. Compare against the highest existing
          # tag instead. Skipped when no tag is available in this checkout.
          version_name="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/')"
          highest_tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -n "$highest_tag" ] && [ -n "$version_name" ]; then
            # Strip the fork's -fqN suffix before comparing: it is release
            # metadata on top of an upstream baseline, not the versionName.
            highest_version="${highest_tag#v}"
            highest_version="${highest_version%%-fq*}"
            lowest="$(printf '%s\n%s\n' "$version_name" "$highest_version" | sort -V | head -1)"
            if [ "$lowest" = "$version_name" ] && [ "$version_name" != "$highest_version" ]; then
              echo "::error::pubspec version $version_name is below the highest tag $highest_tag" >&2
              exit 1
            fi
          fi
          version_args=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Tag shape was validated above; strip the leading v and the fork
            # suffix (-fqN) — the suffix is not part of the versionName.
            expected="${GITHUB_REF_NAME#v}"
            version_args=(--expected-version-name "${expected%%-fq*}")
          fi
          # The fingerprint is pinned only when the release signature was
          # actually applied. Without the secrets the package carries the debug
          # identity, so there is no certificate that pinning could match -- but
          # the signature requirement itself is not dropped (see signer_args).
          abi=arm64-v8a
          python3 scripts/verify_android_apk.py \
            --apk "build/app/outputs/flutter-apk/app-$abi-release.apk" \
            --abi "$abi" \
            --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            "${signer_args[@]}" \
            "${version_args[@]}" \
            --report-dir "build/ci-artifacts/verification/$abi"
          cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "build/ci-artifacts/app-$abi-release.apk"
          {
            printf 'App commit: %s\n' "$GITHUB_SHA"
            printf 'Rust core: fqapi_core (flutter_rust_bridge %s)\n' "$FRB_VERSION"
            printf 'Rust core library SHA-256 (%s): ' "$abi"
            sha256sum "android/app/src/main/jniLibs/$abi/libfqapi_core.so"
            # Record the identity the package actually carries, not the one that
            # was requested: a fork build falls back to the debug key, and anyone
            # installing two builds needs to know whether those identities match.
            printf 'APK signer certificate SHA-256 (%s): %s\n' "$abi" \
              "$(python3 -c 'import json,sys; print(", ".join(json.load(open(sys.argv[1]))["signature"]["certificate_sha256"]))' "build/ci-artifacts/verification/$abi/report.json")"
            if [ "$HAS_RELEASE_SIGNING" = "true" ]; then
              printf 'Signing identity: the release keystore\n'
            else
              printf 'Signing identity: fork debug key, provisioned once and restored from the actions cache\n'
              printf 'A build signed by a different certificate must be uninstalled before this one installs.\n'
            fi
            printf 'NDK: %s\nCMake: %s\nAndroid Build Tools: %s\n' "$NDK_VERSION" "$CMAKE_VERSION" "$BUILD_TOOLS_VERSION"
            flutter --version
            cargo --version
            rustc --version
            java -version 2>&1
          } > build/ci-artifacts/build-info.txt

      - name: Check APK size and Android media boundary
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile
          rows = []
          # The fork dropped the 32-bit split along with the armv7 Rust
          # target, so only the arm64 APK exists here; upstream checks both.
          for abi in ('arm64-v8a',):
              apk = pathlib.Path(f'build/app/outputs/flutter-apk/app-{abi}-release.apk')
              with zipfile.ZipFile(apk) as archive:
                  native = [name for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')]
              unexpected = [name for name in native if any(token in name.lower() for token in ('libmpv', 'libavcodec', 'libavformat', 'libavutil', 'libmediakitandroid'))]
              if unexpected:
                  raise SystemExit(f'Android must retain ExoPlayer without desktop media libraries: {unexpected}')
              rows.append({'abi': abi, 'size_bytes': apk.stat().st_size, 'native_libraries': native})
          print(json.dumps(rows, indent=2))
          pathlib.Path('build/ci-artifacts/android-media-boundary.json').write_text(json.dumps(rows, indent=2))
          PY

      - name: Upload ARM64 APK and verification reports
        id: artifact-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Artifacts expire after retention-days (14 days here, unchanged);
          # download promptly -- the name carries the ref and commit so a
          # tag build is distinguishable from a master build.
          name: fqapp-arm64-${{ steps.artifact-ids.outputs.safe_ref }}-${{ steps.artifact-ids.outputs.short_sha }}-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            app/build/ci-artifacts/app-arm64-v8a-release.apk
            app/build/ci-artifacts/android-media-boundary.json
            app/build/ci-artifacts/build-info.txt
            app/build/ci-artifacts/rust-core-symbols-arm64-v8a.txt
            app/build/ci-artifacts/rust-core-program-headers-arm64-v8a.txt
            app/build/ci-artifacts/verification/arm64-v8a/*.json
            app/build/ci-artifacts/verification/arm64-v8a/*.sha256
            app/build/ci-artifacts/verification/arm64-v8a/*.log

      # Publishing moved to the `publish` job at the bottom of this file: a
      # release must carry both the APK and the macOS build, so it can only be
      # created once both packaging jobs have uploaded their artifacts.

      - name: Retain diagnostics if a build or APK check fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Diagnostics expire after 7 days (unchanged); same ref/sha naming
          # as the main artifact so a failed run stays identifiable.
          name: fqapp-apk-diagnostics-${{ steps.artifact-ids.outputs.safe_ref }}-${{ steps.artifact-ids.outputs.short_sha }}-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/ci-artifacts/rust-core-symbols-*.txt
            app/build/ci-artifacts/rust-core-program-headers-*.txt
            app/build/ci-artifacts/verification/*/*.json
            app/build/ci-artifacts/verification/*/*.log

      - name: Write download summary
        env:
          ARTIFACT_URL_ARM64: ${{ steps.artifact-arm64.outputs.artifact-url }}
          HAS_RELEASE_SIGNING: ${{ steps.signing.outputs.has_release_signing }}
        run: |
          {
            printf '[下载 ARM64 APK 和校验报告](%s)\n\n' "$ARTIFACT_URL_ARM64"
            printf 'App commit: `%s`  \n' "$GITHUB_SHA"
            printf 'Rust core: `fqapi_core` (flutter_rust_bridge `%s`)\n\n' "$FRB_VERSION"
            printf 'Rust core library SHA-256 (arm64-v8a): `%s`\n\n' \
              "$(sha256sum android/app/src/main/jniLibs/arm64-v8a/libfqapi_core.so | cut -d ' ' -f 1)"
            # Record the identity the packages actually carry, not the one that
            # was requested: a fork build falls back to the debug key, and anyone
            # installing two builds needs to know whether those identities match.
            printf 'APK signer certificate SHA-256 (arm64-v8a): `%s`\n\n' \
              "$(python3 -c 'import json; print(", ".join(json.load(open("build/ci-artifacts/verification/arm64-v8a/report.json"))["signature"]["certificate_sha256"]))')"
            if [ "$HAS_RELEASE_SIGNING" = "true" ]; then
              printf '使用正式 release 签名。已验证 Rust 核心库与 APK ZIP 的 16 KiB 对齐；设备播放仍需实测。\n'
            else
              printf '本仓库未配置 release 签名密钥，APK 使用构建机生成的 Android debug 签名：可以直接安装，但签名与官方版不同 —— 装过官方版（或其它签名）的设备必须先卸载。已验证 Rust 核心库与 APK ZIP 的 16 KiB 对齐；设备播放仍需实测。\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fqapp-release.jks"

  # flutter analyze + flutter test 只依赖 Flutter SDK 与解析好的包配置，跟
  # Android 工具链、NDK、Gradle、Rust 交叉编译都没有数据依赖，所以从 apk
  # job 里拆出来单独跑，与它并行。
  #
  # 实测依据：apk job 里这一步原本耗时 5 分 36 秒（run 40090256061，整条
  # 14:33 流水线的 38%），拆走后 apk job 的关键路径变成约 8 分 57 秒，净省
  # 5 分 36 秒。
  #
  # 不是缩水版：这里跑的就是 apk job 原先那句 `flutter test` 的全量套件
  # （2276 passed / 11 skipped），scripts/test_quick.sh 也把全量运行写成交付
  # 前门禁。
  dart-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Check out app source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          persist-credentials: false

      # 不装 Rust 工具链、NDK、Gradle、Node：这里只需要 Flutter SDK。
      # test/rust_host_integration_test.dart 会发起真实的 Dart -> FRB -> Rust
      # 调用，但它在 host cdylib 缺失时是 skip（skip: skipReason），既不失败
      # 也不静默通过。真正跑这个名字的是 apk job 里的
      # scripts/run_rust_host_tests.sh，那个 job 会先构建 host 库。
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Dart package dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      # PR 历史守卫（.github/workflows/pr-history.yml）的脚本自身要有人测：
      # 它只在 pull_request_target 里跑，平时没人看，坏掉的表现是「静默放行
      # 一个超大 PR」而不是报错。用例 5 条、0.6 秒，比不测划算。
      - name: Test the PR history guard
        run: python3 -m unittest test/pr_history_guard_test.py

      # Size is review context, not a quality gate. Even a reporting error
      # must not block the build; analysis and functional checks stay enforced.
      # 上游 11-02 把这条从「冻结行数债务」的阻塞门禁降级成信息报告，
      # 并删掉了 scripts/line_budget.json（脚本改为只打印尺寸）。
      - name: Report source sizes (informational)
        continue-on-error: true
        run: bash scripts/check_line_budget.sh

      # --reporter compact 用进度点代替每个用例一行：名字里带 "failed"/"error"
      # 的通过用例（错误处理覆盖）不再看着像失败，真失败的仍会打印完整异常和
      # 堆栈。
      #
      # --concurrency 保持 2，与 dart-check.yml 一致。曾经提到 4 想省时间，结
      # 果 2026-11-02 那次构建栽在 audio_downloader_test 的
      # 「discard 后立刻重下…」上：那条用例用 `Future.delayed(100ms)` 当窗口，
      # 断言「旧协程还没收尾」，本质是在测收尾耗时而不是并发正确性（真正的
      # 串行化由 _runs 的 key 占位保证，跟并发度无关）。并发度一高，收尾在
      # 窗口内完成，用例就翻脸。要提速得先把那条用例改成不依赖墙钟时间。
      - name: Test
        run: flutter test --no-pub --concurrency=2 --reporter compact

  # 交付面是两个文件：APK + macOS 桌面包（universal 单个包，内含 arm64 与
  # x86_64 两条 slice，Intel 与 Apple Silicon 装同一个文件）。桌面包与 APK 同
  # 一次 dispatch 产出（macos.yml 是可复用工作流），勾了 `macos` 就出；填了
  # release_tag 则强制出 —— 发布只认两件齐全。tag 推送仍只跑 APK，不建 Release。
  macos:
    if: >-
      github.event_name == 'workflow_dispatch'
      && (inputs.release_tag != '' || inputs.macos)
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read

  # Windows 与 macOS 一样走 workflow_call 复用，而不是把 130 行 pwsh 抄进来：
  # windows.yml 自己还要能单独 dispatch（排障时带 verify_player 跑 libmpv 验证），
  # 抄一份就得维护两处。
  #
  # 默认不跑 —— 一台 windows runner 45 分钟，且这个包还没做过真机验收
  # （WINDOWS.md 之外的实测记录为零）。发布口径按「勾了才算」：publish 的
  # needs 里带上它，但判定放宽成 `success || skipped`，没勾时不会挡住发版；
  # 勾了且成功，便携包就作为额外资产进正式 Release。
  windows:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.windows
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read

  # Linux 是实验性构建：Arch 容器里能编出包，但我们没有 Linux 桌面做安装、
  # 朗读、播放的实测（见 LINUX.md 的红线 4）。所以它默认不跑、不进 Release
  # 资产、也不在 publish 的 needs 里 —— 发包不受 Linux 影响，Linux 挂了也不
  # 会挡住发包。要出包时勾 linux（或 dispatch 时 input linux=true）。
  #
  # 为什么不另开 linux.yml：一次 dispatch 想把三个平台都拿出来时，多一个
  # workflow 就要多一次手动点，而且 artifact/Release 的组装逻辑要跨文件对
  # 齐。放在这里与 macos 的位置对称，发布口径只有这一处。
  linux:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # 宿主机只负责跑容器，包的 ABI 完全来自这个 Arch 镜像（钉 digest，
    # 避免 `archlinux:base` 漂移后突然换掉 gcc/glibc）。
    container:
      options: --cpus=2 --memory=6g --memory-swap=7g --memory-reservation=4g
      image: archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    env:
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      FLUTTER_ROOT: /opt/flutter
      PUB_CACHE: /home/builder/.pub-cache
      CARGO_HOME: /home/builder/.cargo
      # `cargo fetch` 之后必须离线，任何偷偷访问 crates.io 的行为都要失败：
      # 否则 PKGBUILD 的源校验就形同虚设。
      CARGO_NET_OFFLINE: 'true'
    steps:
      - name: Prepare isolated Arch snapshot (never the host)
        run: |
          # 钉住某一天的归档：Arch 是滚动发行版，今天的 base 镜像明天装的
          # gcc/glibc 未必能重现同一个包。
          printf 'Server = https://archive.archlinux.org/repos/2026/11/09/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm
          pacman -S --needed --noconfirm base-devel git clang cmake ninja pkgconf gtk3 libsecret mpv libepoxy libglvnd libx11 dbus xdg-utils xdg-user-dirs hicolor-icon-theme rust python nodejs ffmpeg patchelf desktop-file-utils zstd unzip xz curl speech-dispatcher libspeechd espeak-ng xdg-desktop-portal
          useradd -m builder
          rustc --version | grep -E '^rustc 1\.99\.1 '

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch exact official Flutter SDK
        run: |
          curl --fail --location --retry 3 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz -o /tmp/flutter.tar.xz
          # 3.47.9 的归档哈希，与 env.FLUTTER_VERSION 绑死：改版本必须同时改这里。
          echo '25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  /tmp/flutter.tar.xz' | sha256sum -c -
          tar -xJf /tmp/flutter.tar.xz -C /opt
          chown -R builder:builder /opt/flutter "$GITHUB_WORKSPACE"

      - name: Resolve locked inputs and build the Arch package
        shell: bash
        run: |
          chown -R builder:builder /home/builder
          runuser -u builder -- nice -n 10 bash -euo pipefail <<'BUILD'
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          mkdir -p build/validation/linux
          flutter --version --machine > build/validation/linux/flutter.json
          python -c 'import json; assert json.load(open("build/validation/linux/flutter.json"))["frameworkRevision"] == "c197ca5199e9ee5661e865596c9c07294dfab51c"'
          grep -q 'flutter_rust_bridge = "=2.13.0"' rust/Cargo.toml
          flutter precache --linux
          flutter pub get --enforce-lockfile
          # SDK 迁移会往 analysis_options.yaml 里塞排除项；仓库里那份是基准。
          git restore --source=HEAD -- analysis_options.yaml
          CARGO_NET_OFFLINE=false cargo fetch --manifest-path rust/Cargo.toml --locked
          flutter analyze --no-pub
          python test/linux_packaging_test.py
          bash scripts/build_linux_package.sh /tmp/arch-package HEAD
          git diff --exit-code -- pubspec.lock rust/Cargo.lock
          pacman -Q > build/validation/linux/arch-packages.txt
          printf '%s\n' 'EXPERIMENTAL: no hardware, schema rollback, clean installation or licensing acceptance; no formal Release.' > build/validation/linux/ACCEPTANCE.txt
          BUILD

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fqapp-linux-arch-${{ github.sha }}
          path: |
            /tmp/arch-package/*.pkg.tar.zst
            /tmp/arch-package/elf-report.txt
            build/validation/linux
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [apk, macos, dart-gate, windows]
    # 原子发布：基线的两个包都成功、测试也通过才建 Release。除了「不出现只有
    # 一半资产的版本」，还要挡住一种新情况 —— dart-gate 拆出去并行后，apk job
    # 不再自己跑测试，如果这里不看 dart-gate，测试挂了包照样会发出去。
    # 注意 `!cancelled()` 会覆盖 needs 失败时的默认跳过，所以每个依赖都要
    # 显式检查 result。job 名带连字符，必须用下标写法。
    #
    # windows 在 needs 里，但判定放宽成 `success || skipped`：它是可选产物
    # （默认不勾），没勾时整个 job skipped，不能因此挡住发版；反过来勾了就
    # 必须成功 —— 用户点了「要 Windows」，发出去的版本却没有，比不发更糟。
    # linux 仍不在 needs 里：产物只当 Artifacts 供人下载试装，不进 Release
    # 资产（LINUX.md 红线 4），也就不能让它拖住发版。
    if: >-
      !cancelled()
      && github.event_name == 'workflow_dispatch'
      && inputs.release_tag != ''
      && needs.apk.result == 'success'
      && needs.macos.result == 'success'
      && needs['dart-gate'].result == 'success'
      && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compute the APK artifact name
        id: ids
        run: |
          # 与 apk job 的 artifact 命名保持一致：artifact 名不接受 '/',所以
          # ref 里的斜杠要换掉；run_number 保留，重跑不会撞名。
          printf 'apk=%s\n' \
            "fqapp-arm64-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}-${{ github.run_number }}" \
            >> "$GITHUB_OUTPUT"

      - name: Download the APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.ids.outputs.apk }}
          path: release

      - name: Download the macOS artifacts
        uses: actions/download-artifact@v4
        with:
          # macos.yml 只有一条 leg，artifact 名固定为 fqapp-macos-universal
          # （内含 arm64 + x86_64 两条 slice 的一个 .app）。
          name: fqapp-macos-universal
          path: release

      - name: Download the Windows artifacts
        # 没勾 windows 时那个 job 整个 skipped，这里没有东西可下 —— 跳过。
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          # windows.yml 的唯一产物：便携包 zip（外加一份构建日志 artifact，
          # 那是有失败才看的东西，不进 Release）。
          name: fqapp-windows-x64-preview
          path: release

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*|v[0-9]*.[0-9]*.[0-9]*-fq[0-9]*) ;;
            *)
              echo "::error::The release tag must match v<major>.<minor>.<patch>[-fqN] (got '$RELEASE_TAG')." >&2
              exit 1
              ;;
          esac
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          # 资产名统一带 tag：Android 侧是 ARM64 单包（32 位已不再构建），
          # 桌面侧是 .app 打的 zip（ad-hoc 签名，首次打开要清 quarantine）。
          # macOS 只发一个 universal 包：同一个 .app 里带 arm64 与 x86_64 两条
          # slice，Intel 与 Apple Silicon 装同一个文件都能跑，用户不用挑。
          mkdir -p dist
          apk_src="$(find release -name 'app-arm64-v8a-release.apk' -print -quit)"
          mac_src="$(find release -name 'fqapp-macos.zip' -print -quit)"
          info_src="$(find release -name 'build-info.txt' -print -quit)"
          # Windows 是可选资产：没勾 windows 时这里为空，不是错误。
          win_src="$(find release -name 'fqapp-windows-x64-preview.zip' -print -quit)"
          for f in "$apk_src" "$mac_src" "$info_src"; do
            if [ -z "$f" ]; then
              echo "::error::发布资产缺失（APK / macOS universal zip / build-info.txt）" >&2
              find release -maxdepth 3 -type f | head -50 >&2
              exit 1
            fi
          done
          cp "$apk_src" "dist/fqapp-$RELEASE_TAG-arm64-v8a.apk"
          cp "$mac_src" "dist/fqapp-$RELEASE_TAG-macos.zip"
          cp "$info_src" dist/build-info.txt
          # 资产清单按实际构建出来的东西拼，而不是写死三个路径：写死的话
          # 没勾 windows 时 gh 会因为文件不存在而整条发版失败。
          assets=(
            "dist/fqapp-$RELEASE_TAG-arm64-v8a.apk"
            "dist/fqapp-$RELEASE_TAG-macos.zip"
            dist/build-info.txt
          )
          if [ -n "$win_src" ]; then
            cp "$win_src" "dist/fqapp-$RELEASE_TAG-windows-x64.zip"
            assets+=("dist/fqapp-$RELEASE_TAG-windows-x64.zip")
          fi
          ls -l dist

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file .github/release-notes.md \
            --target "$GITHUB_SHA" \
            "${assets[@]}"
          printf 'Published %s with %s assets\n' "$RELEASE_TAG" "${#assets[@]}"

      - name: Summarise the release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            printf '## 已发布 %s\n\n' "$RELEASE_TAG"
            printf -- '- `fqapp-%s-arm64-v8a.apk` — Android arm64\n' "$RELEASE_TAG"
            printf -- '- `fqapp-%s-macos.zip` — macOS 13+，universal（Apple Silicon 原生 / Intel 原生），解压后是 .app\n' "$RELEASE_TAG"
            # 有没有 Windows 包取决于这次 dispatch 勾没勾，按实际文件判断，
            # 免得摘要里写了一个不存在的资产。
            if [ -f "dist/fqapp-$RELEASE_TAG-windows-x64.zip" ]; then
              printf -- '- `fqapp-%s-windows-x64.zip` — Windows 10/11 便携包，解压即用（未做真机验收）\n' "$RELEASE_TAG"
            fi
            printf -- '- `build-info.txt` — Rust 核心与签名指纹\n'
          } >> "$GITHUB_STEP_SUMMARY"
