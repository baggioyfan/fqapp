name: Windows build and regression

on:
  # 本 fork 只发布 Android 与 macOS，Windows 产物一直没人用，而 push 命中
  # lib/** 或 rust/** 就会自动起一个 windows-latest 运行（45 分钟额度）。
  # 故去掉 push / pull_request 两个触发块，只留手动触发。
  # 需要恢复自动触发时，把上游的这两个 paths 块贴回来即可：
  #   pull_request: / push: branches: [master]，paths 为
  #   lib/** test/** rust/** native/** windows/** third_party/** pubspec.*
  #   scripts/*windows* .github/workflows/windows.yml
  workflow_dispatch:
    inputs:
      verify_player:
        description: 也跑 libmpv 播放验证（需要桌面会话，托管 runner 上不稳定）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve dependencies on the official unmodified SDK
        # --enforce-lockfile：不带它时 flutter pub get 会静默改写 lock，
        # CI 测的就不是仓库里那份依赖了。
        run: flutter pub get --enforce-lockfile
      - name: Analyze application
        run: flutter analyze --no-pub
      # Informational source sizes are reported by the Android Dart job.
      - name: Test layout and playback lifecycle
        run: >-
          flutter test --no-pub
          test/desktop_detail_layout_test.dart test/desktop_platform_test.dart
          test/desktop_video_layout_test.dart test/player_page_test.dart
          test/book_open_entry_test.dart
      - name: Restore matching release binaries
        id: bundle-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/windows/x64/runner/Release
            rust/target/release/fqapi_core.dll
          key: windows-3.47.9-rust1.99.1-${{ runner.arch }}-v1-${{ hashFiles('lib/**', 'pubspec.*', 'rust/Cargo.*', 'rust/src/**', 'rust/assets/**', 'rust/build.rs', 'native/**', 'assets/**', 'windows/runner/**', 'windows/CMakeLists.txt', 'windows/flutter/CMakeLists.txt', 'third_party/**') }}
      - name: Build Windows release
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        run: flutter build windows --release --target lib/main.dart
      - name: Save verified-source release binaries
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/windows/x64/runner/Release
            rust/target/release/fqapi_core.dll
          key: ${{ steps.bundle-cache.outputs.cache-primary-key }}
      - name: Smoke launch the packaged app
        # 编译通过不等于跑得起来。2026-11 实测：在一台远程桌面会话的机器上，
        # dxdiag 显示 Direct3D 加速 0/4（会话的显示适配器是虚拟显示器，没有 D3D 能力），
        # ANGLE 建不出 D3D11 device，Impeller 和 Skia 两条路都在初始化渲染时崩，
        # 进程以 0xC0000409 退出，窗口根本不出现。
        #
        # analyze 和 flutter test 都拦不住这种问题：flutter test 跑的是
        # flutter_tester + --enable-software-rendering，跟桌面渲染器无关。
        # 所以这里用托管 runner 的完整图形栈把打包出来的 exe 真启动一次，
        # 进程活过 20 秒才算过。
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = 'build/windows/x64/runner/Release/fqapp.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          New-Item -ItemType Directory -Force -Path 'build/validation' | Out-Null
          $err = 'build/validation/windows-smoke.err.log'
          $out = 'build/validation/windows-smoke.out.log'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -RedirectStandardError $err -RedirectStandardOutput $out -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            $alive = [int]($p.ExitTime - $p.StartTime).TotalSeconds
            Write-Host "SMOKE FAIL: fqapp.exe exited after ${alive}s with code $($p.ExitCode)"
            foreach ($f in @($err, $out)) {
              if (Test-Path $f) { Write-Host "--- $f ---"; Get-Content $f }
            }
            exit 1
          }
          Write-Host "SMOKE OK: fqapp.exe still alive after 20s (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - name: Verify native decryption and access control
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
            $env:PATH += ';C:\ProgramData\chocolatey\bin'
          }
          python scripts/verify_windows_media.py
          if ($LASTEXITCODE -ne 0) { throw 'Native media verification failed' }
      - name: Diagnose headless libmpv playback and teardown (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_player
        shell: pwsh
        run: |
          dart compile exe scripts/verify_windows_player.dart -o build/verify_windows_player.exe
          if ($LASTEXITCODE -ne 0) { throw 'AOT player verification compilation failed' }
          & ./build/verify_windows_player.exe
          if ($LASTEXITCODE -ne 0) { throw 'libmpv verification failed' }
      - name: Collect licenses and package portable preview
        shell: pwsh
        run: |
          python scripts/collect_windows_licenses.py
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed' }
          $src = 'build/windows/x64/runner/Release'
          foreach ($file in @('fqapp.exe','fqapi_core.dll','libmpv-2.dll','data/app.so')) {
            if (-not (Test-Path "$src/$file")) { throw "Missing $file" }
          }
          Copy-Item LICENSE "$src/LICENSE.txt"
          Copy-Item WINDOWS.md "$src/使用说明.md"
          Compress-Archive -Path "$src/*" -DestinationPath 'fqapp-windows-x64-preview.zip'
          Get-FileHash fqapp-windows-x64-preview.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fqapp-windows-x64-preview
          path: |
            fqapp-windows-x64-preview.zip
            build/validation/windows-media/*.json
            build/validation/windows-player/*.json
            build/validation/windows-smoke*.log
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: windows-build-logs
          path: |
            build/windows/**/*.log
            build/validation/windows-media/*.json
            build/validation/windows-player/*.json
            **/CMakeOutput.log
            **/CMakeError.log
          if-no-files-found: ignore
