name: Dart Check

# Fast feedback for Dart-only changes. The APK workflow spends most of its time
# on the Rust/NDK toolchain, so this lint-and-test pass finishes in minutes and
# reports Dart mistakes long before that one reaches its analyze step.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Dart package dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        # 临时诊断：逐文件跑，每个文件最多 150 秒，卡住的文件会打印出来。
        run: |
          set +e
          for f in test/*_test.dart; do
            echo "=== $f ==="
            timeout -k 10 150 flutter test --no-pub "$f"
            code=$?
            if [ $code -ne 0 ]; then echo "!!! $f exit=$code"; fi
          done
          echo "=== done ==="
