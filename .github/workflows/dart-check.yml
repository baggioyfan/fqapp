name: Dart Check

# Fast feedback for Dart-only changes. The APK workflow spends most of its time
# on the Rust/NDK toolchain, so this lint-and-test pass finishes in minutes and
# reports Dart mistakes long before that one reaches its analyze step.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: No platform-specific pub overrides committed
        # pubspec_overrides.yaml 只由 macOS 构建在本地临时生成；一旦入库，下面这条
        # --enforce-lockfile 就会因为 connectivity_plus 版本对不上而失败。
        run: test ! -f pubspec_overrides.yaml

      - name: Resolve Dart package dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        # 每个用例显式给两分钟上限：`pumpAndSettle` 自己的超时是十分钟，
        # 一个卡住的 widget 测试就能吃掉整份作业的预算，而结果只显示
        # 「被取消」—— 看不出是哪个用例。
        run: flutter test --no-pub --concurrency=2 --timeout=120s
