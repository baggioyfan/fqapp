name: Dart Check

# Fast feedback for Dart-only changes. The APK workflow spends most of its time
# on the Rust/NDK toolchain, so this lint-and-test pass finishes in minutes and
# reports Dart mistakes long before that one reaches its analyze step.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 build / windows 同版本：pubspec.lock 的传递依赖是按 3.50.0 解析的
  # （dart >=3.13 / flutter >=3.47），用旧版本跑 pub get 会被 --enforce-lockfile
  # 判成 lock 不一致。
  FLUTTER_VERSION: '3.50.0'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: No platform-specific pub overrides committed
        # pubspec_overrides.yaml 只由 macOS 构建在本地临时生成；一旦入库，下面这条
        # --enforce-lockfile 就会因为 connectivity_plus 版本对不上而失败。
        run: test ! -f pubspec_overrides.yaml

      - name: Resolve Dart package dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Fork suite
        # fork 自己加的功能，测试单独拉一条跑：换基底时把同名测试文件整份
        # checkout 成上游版，会把 fork 往里加的用例静默吃掉 —— 全量 Test 照样
        # 全绿，只是少了几条（2026-11-24 就这么丢过 5 条，连带两处产品回归）。
        # 单独一步的目的是让它的成败和条数在日志里直接看得见，不用拿总数去猜。
        # 清单和基线由 test/fork_suite_guard_test.dart 守着。
        run: |
          files=$(awk '!/^[[:space:]]*#/ && NF {print $1}' test/fork_suite.txt | tr '\n' ' ')
          echo "fork 自有测试：$(printf '%s\n' $files | wc -l) 个文件"
          flutter test --no-pub --concurrency=2 --timeout=120s $files

      - name: Test
        # 每个用例显式给两分钟上限：`pumpAndSettle` 自己的超时是十分钟，
        # 一个卡住的 widget 测试就能吃掉整份作业的预算，而结果只显示
        # 「被取消」—— 看不出是哪个用例。
        run: flutter test --no-pub --concurrency=2 --timeout=120s
