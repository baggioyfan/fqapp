name: Republish from build

# 用「已经跑过的构建」发 Release，不重新编译。
#
# 存在的理由：Actions 产物（artifact）和 Release 资产是两套存储，GitHub 没有
# 「把 artifact 直接挂成 asset」的接口，必须把文件实体重新上传一次。在本地传
# 等于让几十 MB 经个人网络来回走两遍；在本 workflow 里传是 GitHub 内部网络，
# 几秒就完事，也不用重新跑一遍 flutter build。
#
# 正文统一取仓库里的 `.github/release-notes.md`，与常规发布路径同源。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 取用哪个构建运行的产物（runs/<id>，在 Actions 页面 URL 里）
        required: true
        type: string
      release_tag:
        description: 发布 tag，例如 v1.0.200-fq2
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  republish:
    name: republish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物并整理成发布资产
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p raw dist
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D raw
          echo "--- 下载到的东西 ---"
          find raw -type f -printf '%s\t%p\n' | sort -rn

          apk=$(find raw -name '*.apk' | head -1)
          mac=$(find raw -name 'fqapp-macos*.zip' | head -1 || true)
          # Windows job 上传的是一个成品 zip（`fqapp-windows-x64-preview.zip`），
          # 不是目录，所以直接当资产用，不再重新打包。
          win=$(find raw -name '*windows*.zip' | head -1 || true)
          lin=$(find raw -name '*.pkg.tar.zst' | head -1 || true)
          info=$(find raw -name 'build-info.txt' | head -1 || true)
          # 只有 APK 是硬性的；build-info 在 APK artifact 里偶尔拿不到，缺了
          # 就少一个校验文件，不该因此把整次发布挡回去。
          [ -n "$apk" ] && [ -s "$apk" ] || { echo "缺少必需产物：apk"; exit 1; }

          cp "$apk" "dist/fqapp-${TAG}-arm64-v8a.apk"
          if [ -n "$mac" ]; then
            cp "$mac" "dist/fqapp-${TAG}-macos.zip"
          else
            echo '::warning::本次运行没有 macOS 产物（runner 未分配到），先发其余资产'
          fi
          if [ -n "$win" ]; then
            cp "$win" "dist/fqapp-${TAG}-windows-x64.zip"
          fi
          if [ -n "$lin" ]; then
            cp "$lin" "dist/fqapp-${TAG}-linux-x86_64.pkg.tar.zst"
          fi
          if [ -n "$info" ]; then
            cp "$info" dist/build-info.txt
          else
            echo '::warning::artifact 里没有 build-info.txt，本次发布不带校验清单'
          fi

          ls -l dist
          if [ -n "$info" ]; then
            echo "--- build-info 的 App commit ---"
            grep -i '^App commit' dist/build-info.txt
          fi

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          echo "target commit = $sha"
          # 同 build.yml：正文取自 `.github/release-notes.md`，资产清单按实际文件生成，
          # 免得正文里的文件名跟着上一版的 tag 走。
          notes=$(mktemp)
          {
            # 跨 step 不共享变量，这里按 dist 里实际有什么来判断。
            if ! ls dist/fqapp-*-macos.zip >/dev/null 2>&1; then
              printf '> ⚠️ **macOS 包稍后补传**：这次 macOS job 没能拿到 GitHub 的 runner，'
              printf '其余平台已就绪，包编出来后会上传到本页。\n\n'
            fi
            cat .github/release-notes.md
            printf '\n## 资产\n\n'
            for a in dist/fqapp-*.apk dist/fqapp-*.zip dist/fqapp-*.zst dist/build-info.txt; do
              [ -f "$a" ] || continue
              printf -- '- `%s` — %s B\n' "$(basename "$a")" "$(wc -c < "$a" | tr -d ' ')"
            done
          } > "$notes"

          # 只把 dist 里真实存在的文件交给 gh：glob 没匹配时 bash 会把字面量
          # 原样传过去，gh 直接 `no matches found` 整条失败（2026-11-23 就这么
          # 挂过一次，缺 macOS 时 dist 里没有 zip）。
          assets=()
          for f in dist/fqapp-*.apk dist/fqapp-*.zip dist/fqapp-*.zst dist/build-info.txt; do
            if [ -f "$f" ]; then assets+=("$f"); fi
          done
          [ ${#assets[@]} -gt 0 ] || { echo 'dist 里没有可发布的资产'; exit 1; }

          # Release 已存在时改为「补传资产 + 重写正文」：macOS runner 会连续
          # 拿不到，只能先用其余平台发出去，等它编出来再补这一趟。
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：补传资产并重写正文"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$TAG" \
              -R "$GITHUB_REPOSITORY" \
              --target "$sha" \
              --title "$TAG" \
              --notes-file "$notes" \
              "${assets[@]}"
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets \
            --jq '"\(.url)", (.assets[] | "  \(.name) \(.size) B")'
